        }

        }
        header h1 { font-size: 2.5rem; color: #fff; margin-bottom: 10px; }
        header p { font-size: 1.1rem; color: #a0a0b0; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .case-study { background: #15151e; border: 1px solid #2a2a35; border-radius: 12px; padding: 40px; margin-bottom: 40px; }
        .case-study h2 { margin-bottom: 20px; color: #fff; font-size: 2rem; }
        .case-study p { margin-bottom: 30px; color: #b0b0c0; max-width: 800px; }
        
        /* --- GAME CONTAINER EMBED --- */
        .game-wrapper { display: flex; justify-content: center; margin-top: 40px; }
        #game-container {
            position: relative; width: 960px; height: 540px;
            background-image: url('bedroom_bg.png'); background-color: #120917;
            background-size: cover; background-position: center;
            border: 6px solid #24140a; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            font-family: 'Courier New', Courier, monospace; color: #fce8cc;
            overflow: hidden; user-select: none;
        }

        #play-area { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
        .sprite-layer {
            position: absolute; bottom: 25px; left: 33%; transform: translateX(-50%);
            image-rendering: pixelated; width: 260px; height: auto; pointer-events: none;
        }
        
        /* Strict Z-Index Layering to support all 138 asset overlaps */
        #sprite-base { z-index: 10; }
        #layer-tights { z-index: 11; }
        #layer-socks { z-index: 12; }
        #layer-bodysuit { z-index: 13; }
        #layer-bottoms { z-index: 14; }
        #layer-shoes { z-index: 15; }
        #layer-tops { z-index: 16; }
        #layer-dresses { z-index: 17; }
        #layer-belts { z-index: 18; }
        #layer-layers { z-index: 19; }
        #layer-outer { z-index: 20; }
        #layer-jewelry { z-index: 21; }
        #layer-bags { z-index: 22; }
        #layer-hair-acc { z-index: 23; }

        #wardrobe-panel {
            position: absolute; right: 30px; bottom: 25px; width: 440px; height: 480px;
            background: linear-gradient(135deg, #3a2214, #221209, #2b170c);
            border: 10px solid #1c0e06; border-radius: 2px 2px 0 0;
            box-shadow: -15px 15px 25px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.9);
            padding: 15px; display: flex; flex-direction: column; pointer-events: auto; z-index: 100;
        }
        #wardrobe-panel::before {
            content: ''; position: absolute; top: -20px; left: -15px; right: -15px; height: 10px;
            background: #140904; border-bottom: 3px solid #2a160b;
        }
        #catalog-header {
            text-align: center; font-weight: bold; font-size: 1.2rem; color: #d1b896;
            text-shadow: 2px 2px 4px #000; margin-bottom: 12px; border-bottom: 2px groove #4a2b1a;
            padding-bottom: 8px; letter-spacing: 2px;
        }
        
        #tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 15px; }
        .tab-btn {
            background: linear-gradient(to bottom, #4a2b1a, #2b170c); border: 1px solid #140904;
            border-bottom: 3px solid #140904; padding: 6px 0px; font-size: 0.60rem; color: #d1b896;
            font-family: inherit; font-weight: bold; cursor: pointer; text-align: center;
        }
        .tab-btn.active, .tab-btn:hover { background: linear-gradient(to bottom, #613b26, #3a2214); color: #fff; }
        
        #item-grid {
            flex-grow: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            overflow-y: auto; padding: 10px; background: #120904; box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);
            border: 2px solid #0a0401;
        }
        #item-grid::-webkit-scrollbar { width: 8px; }
        #item-grid::-webkit-scrollbar-track { background: #120904; }
        #item-grid::-webkit-scrollbar-thumb { background: #3a2214; border-radius: 4px; }
        
        .item-card {
            background: rgba(43, 23, 12, 0.4); border-bottom: 4px solid #221209; border-radius: 2px;
            padding: 5px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative;
        }
        .item-card:hover { background: rgba(74, 43, 26, 0.6); }
        .item-card.equipped { background: rgba(97, 59, 38, 0.7); border-bottom-color: #79ff4d; }
        .item-card.equipped::after { content: '★'; position: absolute; top: 2px; right: 4px; color: #79ff4d; }
        .item-thumb { width: 50px; height: 50px; background-size: contain; background-repeat: no-repeat; background-position: center; image-rendering: pixelated; }
        .item-id { font-size: 0.50rem; margin-top: 5px; color: #a48e77; text-align: center; line-height: 1.2; }

        #controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; border-top: 2px groove #4a2b1a; padding-top: 12px; }
        .control-btn { background: #2b170c; border: 1px solid #140904; color: #d1b896; font-size: 0.75rem; padding: 8px; cursor: pointer; font-weight: bold; }
        .control-btn:hover { background: #4a2b1a; color: #fff; }

            position: absolute; bottom: 25px; left: 25px; background: rgba(18, 9, 23, 0.85); border: 2px solid #4a2754;

            { id: "ACC37", file: "acc37.png", thumb: "Grey-Quartz Spiked", type: "jewelry" },

            // Hair Accessories (from original integration)
            { id: "ACC_W_BOW", file: "acc_bow_w.png", thumb: "White Hair Bow", type: "hair-acc" },
            { id: "ACC_B_BOW", file: "acc_bow_b.png", thumb: "Black Hair Bow", type: "hair-acc" },
            { id: "ACC_HBAND", file: "acc_headband.png", thumb: "White Headband", type: "hair-acc" },
            { id: "ACC_HPINS", file: "acc_pins.png", thumb: "Hair Pins", type: "hair-acc" }
        ]
    };

    let activeCategory = "tops";
    
    // Expanded State Manager mapping all 13 distinct layer types
    let equipped = {
        "tights": null,
        "socks": null,
        "bodysuit": null,
        "bottoms": null,
        "shoes": null,
        "tops": null,
        "dresses": null,
        "belts": null,
        "layers": null,
        "outer": null,
        "jewelry": null,
        "bags": null,
        "hair-acc": null
    };

    function changeCategory(category) {
        activeCategory = category;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('item-grid');
        grid.innerHTML = '';
        wardrobe[activeCategory].forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            // Allow multiple items to be equipped within mixed layers by checking exact file match
            if (equipped[item.type] === item.file) card.classList.add('equipped');
            
            card.onclick = () => toggleEquip(item);
            
            const thumb = document.createElement('div');
            thumb.className = 'item-thumb';
            thumb.style.backgroundImage = `url('${item.file}')`;
            
            const idLabel = document.createElement('div');
            idLabel.className = 'item-id';
            idLabel.innerText = `${item.id}\n${item.thumb}`;
            
            card.appendChild(thumb);
            card.appendChild(idLabel);
            grid.appendChild(card);
        });
    }

    function toggleEquip(item) {
        const layerElement = document.getElementById(`layer-${item.type}`);
        
        if (equipped[item.type] === item.file) {
            equipped[item.type] = null; 
            layerElement.src = ""; 
            layerElement.alt = "";
            showPrompt(`Removed ${item.thumb}`);
        } else {
            // Note: Currently replaces items of the same 'type'. To allow stacking (e.g., multiple rings), 
            // the 'type' data structure would need granular breakdown (e.g., 'type: ring', 'type: necklace').
            equipped[item.type] = item.file; 
            layerElement.src = item.file; 
            layerElement.alt = item.thumb;
            showPrompt(`Put on ${item.thumb}!`);
        }
        renderGrid();
    }

    function showPrompt(text) { 
        document.getElementById('prompt-bar').innerText = `💬 ${text}`; 
    }

    function randomize() {
        Object.keys(wardrobe).forEach(cat => {
            const list = wardrobe[cat];
            toggleEquip(list[Math.floor(Math.random() * list.length)]);
        });
        showPrompt("Created a random styling combo!");
    }

    function resetAll() {
        Object.keys(equipped).forEach(layer => {
            equipped[layer] = null; 
            document.getElementById(`layer-${layer}`).src = "";
        });
        showPrompt("Starting fresh! Base loaded."); 
        renderGrid();
    }

    function finishOutfit() { 
        showPrompt("Outfit saved to your photo diary!"); 
    }

    window.onload = () => { renderGrid(); };
</script>
</body>
</html>
